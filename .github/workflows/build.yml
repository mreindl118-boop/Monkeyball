name: Build Game

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUM: ${{ github.run_number }}

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rollin-rascals-web
          path: dist/

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy web build into desktop shell
        run: Copy-Item -Recurse -Force dist desktop/dist
        shell: pwsh
      - name: Install desktop deps
        run: npm install
        working-directory: desktop
      - name: Package Windows builds (installer + portable)
        run: npx electron-builder --win --x64 --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: rollin-rascals-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Stamp Android version from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android
      - name: Force landscape orientation
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Use the repo's stable signing key
        # Android only upgrades an app if the signature matches the installed one.
        # Debug builds sign with ~/.android/debug.keystore, so we pin it.
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: rollin-rascals-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish release (auto-update feed)
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rollin-rascals-android
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: rollin-rascals-windows
          path: win
      - name: Rename assets
        run: |
          mv apk/app-debug.apk "rollin-rascals-${{ github.run_number }}.apk"
          i=0
          for f in win/*.exe; do
            base=$(basename "$f")
            case "$base" in
              *Setup*|*setup*) mv "$f" "rollin-rascals-setup-${{ github.run_number }}.exe" ;;
              *) mv "$f" "rollin-rascals-portable-${{ github.run_number }}.exe" ;;
            esac
          done
          ls -la *.apk *.exe
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Rollin' Rascals build ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automated build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).

            - **Android**: download the `.apk` and open it to install/upgrade (the in-game
              updater points here on startup).
            - **Windows**: `-setup-` is the installer, `-portable-` runs directly.
          files: |
            *.apk
            *.exe
