name: Build Game

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUM: ${{ github.run_number }}

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rollin-rascals-web
          path: dist/

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy web build into desktop shell
        run: Copy-Item -Recurse -Force dist desktop/dist
        shell: pwsh
      - name: Install desktop deps
        run: npm install
        working-directory: desktop
      - name: Package Windows builds (installer + portable)
        run: npx electron-builder --win --x64 --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: rollin-rascals-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Stamp Android version from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android
      - name: Force landscape orientation
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Go edge-to-edge (fill the display cutout, hide the status bar)
        # Phones with a camera notch letterbox the app behind a white system
        # bar unless the theme opts into drawing under the cutout. The launch
        # theme inherits from AppTheme.NoActionBar, so one edit covers both.
        run: |
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n        <item name="android:windowBackground">@color/rrGameBg</item>#' android/app/src/main/res/values/styles.xml
          sed -i 's#</resources>#    <color name="rrGameBg">\#FF0A0A1A</color>\n</resources>#' android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values/styles.xml
      - name: Pin the signing key explicitly
        # Android only upgrades an app if the signature matches the installed one.
        # Relying on ~/.android/debug.keystore proved unreliable on runners, so we
        # wire the repo keystore straight into the Gradle signing config.
        run: |
          cat >> android/app/build.gradle <<'EOG'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOG
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Verify APK is signed with the pinned key (fail loudly if not)
        run: |
          FP_APK=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1)
          FP_KEY=$(keytool -list -v -keystore signing/debug.keystore -storepass android | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1)
          echo "APK: $FP_APK"
          echo "KEY: $FP_KEY"
          [ -n "$FP_APK" ] && [ "$FP_APK" = "$FP_KEY" ] || { echo "::error::APK signature does not match the pinned keystore — auto-update upgrades would break"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rollin-rascals-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish release (auto-update feed)
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rollin-rascals-android
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: rollin-rascals-windows
          path: win
      - name: Rename assets
        run: |
          mv apk/app-debug.apk "rollin-rascals-${{ github.run_number }}.apk"
          i=0
          for f in win/*.exe; do
            base=$(basename "$f")
            case "$base" in
              *Setup*|*setup*) mv "$f" "rollin-rascals-setup-${{ github.run_number }}.exe" ;;
              *) mv "$f" "rollin-rascals-portable-${{ github.run_number }}.exe" ;;
            esac
          done
          ls -la *.apk *.exe
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Rollin' Rascals build ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automated build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).

            - **Android**: download the `.apk` and open it to install/upgrade (the in-game
              updater points here on startup).
            - **Windows**: `-setup-` is the installer, `-portable-` runs directly.
          files: |
            *.apk
            *.exe
