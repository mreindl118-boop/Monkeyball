name: Build crushLAB

# Every push (any branch) and manual runs: lint, test and build the web app, deploy it as the PWA,
# build a signed Android APK from the same build, and publish it as release build-<run>.
# Android is the primary target; see docs/ARCHITECTURE.md, "Android first".

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Read-only by default: the web and android jobs run npm ci (third-party install scripts). Only
# the release job gets write access, and no checkout keeps the token in .git/config.
permissions:
  contents: read

env:
  # Baked into the web build (import.meta.env.VITE_BUILD_NUMBER, see vite.config.ts). The APK's
  # in-app update check compares it with the newest build-<n> release, and the Android
  # versionCode uses the same number, so all three always agree.
  BUILD_NUMBER: ${{ github.run_number }}
  # The branch whose builds are offered to installed apps as updates (and become the
  # releases/latest/download/crushlab.apk link). Builds from any other branch are published as
  # prereleases, which the update check and that link ignore. Set the repository variable
  # RELEASE_BRANCH to change it (for example to main once crushLAB is merged there).
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'claude/repo-fresh-start-gxm2p6' }}

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: crushlab-web
          path: dist/

  pages:
    # The PWA: installable from Chrome on Android (and any browser).
    # Soft-fails until the repo owner sets Settings, Pages, Source: "GitHub Actions" AND lets this
    # branch deploy: the github-pages environment only accepts the default branch unless
    # Settings, Environments, github-pages, Deployment branches lists this one (or this branch
    # becomes the default). The CI token can't change either setting itself.
    name: Deploy PWA to GitHub Pages
    runs-on: ubuntu-latest
    needs: web
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crushlab-web
          path: dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    # What this job assumes about the project `npx cap add android` generates (Capacitor 8,
    # @capacitor/cli 8.5, checked against the template and run 24). Each patch below fails the
    # job if its assumption stops holding, instead of silently shipping an unpatched app.
    # - android/app/build.gradle is Groovy DSL: defaultConfig { versionCode 1  versionName "1.0" }.
    #   The version and signing blocks are appended as a second android { } block, which Gradle
    #   applies after the template's, so they don't depend on its formatting.
    # - res/values/styles.xml has AppTheme.NoActionBar (the running app, with
    #   <item name="android:background">@null</item>) and AppTheme.NoActionBarLaunch (parent
    #   Theme.SplashScreen from androidx core-splashscreen, with
    #   <item name="android:background">@drawable/splash</item>).
    # - res/mipmap-anydpi-v26/ic_launcher.xml is the adaptive launcher icon; assets/android/res
    #   replaces it and the mipmaps (drawn by scripts/make-icons.mjs).
    # - `cap sync` writes server.cleartext from capacitor.config.ts as
    #   android:usesCleartextTraffic="true" into capacitor-cordova-android-plugins' manifest, which
    #   the manifest merger folds into the app's.
    # - minSdk 24, so the APK carries v2/v3 signatures only (apksigner reads them, keytool can't).
    name: Android APK
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          # Capacitor 8 (Android Gradle Plugin 8.13) needs JDK 21.
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Reuse the tested web build: the web job built it with BUILD_NUMBER set (workflow env).
      - uses: actions/download-artifact@v4
        with:
          name: crushlab-web
          path: dist
      - name: Replace the service worker with the kill switch (APK only)
        # Builds 24-25 registered the web app's service worker inside the APK, and it kept serving
        # that build's cached files after an upgrade. The APK never uses a service worker, so its
        # sw.js is a kill switch that clears the caches, removes itself and reloads the app when
        # an old registration checks for an update. The web/PWA build keeps its real worker.
        run: |
          cp scripts/android/sw.js dist/sw.js
          grep -q crushlab-apk-sw-killswitch dist/sw.js || { echo "::error::dist/sw.js is not the APK kill switch"; exit 1; }
          if grep -q registerSW dist/index.html; then echo "::error::index.html registers a service worker in the APK"; exit 1; fi
      - name: Generate Android project
        run: npx cap add android
      - name: Clear stale service-worker storage on every launch
        # Belt and braces with the sw.js kill switch: the activity deletes the WebView's
        # service-worker folder before the WebView starts (saves are in other folders).
        run: |
          f=android/app/src/main/java/app/crushlab/game/MainActivity.java
          test -f "$f" || { echo "::error::MainActivity.java not where expected"; exit 1; }
          cp scripts/android/MainActivity.java "$f"
          grep -q 'Service Worker' "$f"
      - name: Launcher icons and splash icon
        # Pre-rendered by scripts/make-icons.mjs from assets/icon.svg and assets/icon-foreground.svg:
        # adaptive icon (velvet background, foreground, monochrome for themed icons), legacy icons,
        # and the Android 12+ splash icon (crush_splash_icon).
        run: |
          res=android/app/src/main/res
          [ -f "$res/mipmap-anydpi-v26/ic_launcher.xml" ] || { echo "::error::the Capacitor template has no mipmap-anydpi-v26/ic_launcher.xml any more"; exit 1; }
          cp -R assets/android/res/. "$res/"
          for f in $(cd assets/android/res && find . -type f); do
            cmp -s "assets/android/res/$f" "$res/$f" || { echo "::error::icon resource $f did not land in $res"; exit 1; }
          done
          grep -q '@mipmap/ic_launcher_monochrome' "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -qi '#2A0F1F' "$res/values/ic_launcher_background.xml"
          echo "Copied $(cd assets/android/res && find . -type f | wc -l) icon resources"
      - name: Velvet system bars, window and launch screen (no white flash)
        # The status bar stays visible (this isn't a fullscreen game). Android 15+ draws the app
        # edge to edge regardless; the SystemBars config in capacitor.config.ts and the CSS
        # safe-area insets handle that, and these colors cover older versions and the first frames.
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's#</resources>#    <color name="crushVelvet">\#FF2A0F1F</color>\n</resources>#' "$f"
          # The launch theme loses its android:background entirely: a theme-level background paints
          # every view of the starting window, which would cover core-splashscreen's icon on
          # Android 7 to 11 (drawn through android:windowBackground from the two items below).
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="windowSplashScreenBackground">@color/crushVelvet</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/crush_splash_icon</item>#' "$f"
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item>\n        <item name="android:windowBackground">@color/crushVelvet</item>\n        <item name="android:statusBarColor">@color/crushVelvet</item>\n        <item name="android:navigationBarColor">@color/crushVelvet</item>\n        <item name="android:windowLightStatusBar">false</item>#' "$f"
          cat "$f"
          for want in \
            '<color name="crushVelvet">#FF2A0F1F</color>' \
            '"windowSplashScreenBackground">@color/crushVelvet<' \
            '"windowSplashScreenAnimatedIcon">@drawable/crush_splash_icon<' \
            '"android:windowBackground">@color/crushVelvet<' \
            '"android:statusBarColor">@color/crushVelvet<' \
            '"android:navigationBarColor">@color/crushVelvet<' \
            '"android:windowLightStatusBar">false<'; do
            grep -qF "$want" "$f" || { echo "::error::styles.xml patch did not apply: $want"; exit 1; }
          done
          if grep -q '@drawable/splash<' "$f"; then echo "::error::the launch theme still uses the template splash"; exit 1; fi
          launch=$(sed -n '/name="AppTheme.NoActionBarLaunch"/,/<\/style>/p' "$f")
          if echo "$launch" | grep -q '"android:background"'; then echo "::error::the launch theme still sets android:background, which hides the splash icon before Android 12"; exit 1; fi
      - name: Portrait on phones, keyboard resizes, no backups
        # ARCHITECTURE: the APK is portrait. Android 16 ignores this on tablets and foldables
        # (targetSdk 36), which is what we want there.
        # adjustResize: up to Android 10 the WebView only gets the keyboard's (IME) insets, which
        # the SystemBars plugin pads it by, when the window's soft input mode is adjustResize.
        # allowBackup="false": the app's storage holds the player's API keys and adults-only
        # history; it stays out of Google backups (saves move between phones by export).
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation' "$f" || sed -i 's#<activity#<activity android:screenOrientation="portrait"#' "$f"
          grep -q 'android:screenOrientation="portrait"' "$f" || { echo "::error::orientation patch did not apply"; exit 1; }
          grep -q 'android:windowSoftInputMode' "$f" || sed -i 's#<activity#<activity android:windowSoftInputMode="adjustResize"#' "$f"
          grep -q 'android:windowSoftInputMode="adjustResize"' "$f" || { echo "::error::soft input mode patch did not apply"; exit 1; }
          if grep -q 'android:allowBackup=' "$f"; then
            sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' "$f"
          else
            sed -i 's#<application#<application android:allowBackup="false"#' "$f"
          fi
          grep -q 'android:allowBackup="false"' "$f" || { echo "::error::backup patch did not apply"; exit 1; }
      - name: Allow plain-http model servers on the LAN
        # Also set by server.cleartext in capacitor.config.ts (checked after sync); this keeps the
        # app manifest explicit.
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$f" || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$f"
          grep -q 'usesCleartextTraffic="true"' "$f" || { echo "::error::cleartext patch did not apply"; exit 1; }
      - name: Sync web assets and plugins
        run: npx cap sync android
      - name: Check capacitor.config.ts turned cleartext on
        run: |
          f=android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          cat "$f"
          grep -q 'usesCleartextTraffic="true"' "$f" || { echo "::error::cap sync did not write usesCleartextTraffic; is server.cleartext still true in capacitor.config.ts?"; exit 1; }
      - name: Stamp the version and pin the signing key
        # versionCode = run number, so every build upgrades the last one in place.
        # Android only upgrades an app in place if the signature matches the installed one,
        # so every build is signed with the repo's debug keystore.
        run: |
          version=$(node -p "require('./package.json').version")
          cat >> android/app/build.gradle <<EOG

          // crushLAB CI: version from the run number (overrides the template's defaultConfig).
          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "${version} (build ${{ github.run_number }})"
              }
          }
          EOG
          cat >> android/app/build.gradle <<'EOG'

          // crushLAB CI: sign every build with the pinned key in signing/debug.keystore.
          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOG
          tail -n 32 android/app/build.gradle
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Verify the APK is signed with the pinned key
        # minSdk 24 means v2/v3 signing only, which keytool -printcert can't read; use apksigner.
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          FP_APK=$(grep -m1 'SHA-256 digest' signer.txt | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          FP_KEY=$(keytool -list -v -keystore signing/debug.keystore -storepass android | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1 | tr -d ':')
          echo "APK: $FP_APK"
          echo "KEY: $FP_KEY"
          [ -n "$FP_APK" ] && [ "$FP_APK" = "$FP_KEY" ] || { echo "::error::APK signature does not match the pinned keystore"; exit 1; }
      - name: Verify the APK's package, version and cleartext flag
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|application-icon-[0-9]+|launchable-activity):" badging.txt || true
          grep -q "^package: name='app.crushlab.game' versionCode='${{ github.run_number }}' " badging.txt \
            || { echo "::error::expected package app.crushlab.game with versionCode ${{ github.run_number }}"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          cleartext=$(grep -m1 'usesCleartextTraffic' manifest.txt || true)
          echo "${cleartext:-usesCleartextTraffic missing}"
          # aapt2 prints booleans as =true / =false; older formats print (type 0x12)0xffffffff / 0x0.
          if [ -z "$cleartext" ] || echo "$cleartext" | grep -Eq '=false\b|=(\(type 0x12\))?0x0+\b'; then
            echo "::error::the merged manifest does not allow cleartext; LAN model servers would be blocked"; exit 1
          fi
          backup=$(grep -m1 'allowBackup' manifest.txt || true)
          echo "${backup:-allowBackup missing}"
          if [ -z "$backup" ] || echo "$backup" | grep -Eq '=true\b|=(\(type 0x12\))?0xffffffff\b'; then
            echo "::error::the merged manifest allows backups; API keys would reach Google backups"; exit 1
          fi
          unzip -p "$APK" assets/public/sw.js | grep -q crushlab-apk-sw-killswitch \
            || { echo "::error::the APK's sw.js is not the kill switch; old builds' cached files would keep running"; exit 1; }
          ls -l "$APK"
      - name: Name the APK
        # crushlab.apk keeps one stable download link for the newest build:
        # https://github.com/<owner>/<repo>/releases/latest/download/crushlab.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "crushlab-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk crushlab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crushlab-android
          path: |
            crushlab-${{ github.run_number }}.apk
            crushlab.apk

  release:
    name: Publish release (APK download link and update feed)
    runs-on: ubuntu-latest
    needs: [android]
    permissions:
      contents: write
    # One publish at a time, so the check below can't race another run's release. (If two more
    # runs queue up behind a publish, GitHub cancels the older waiting one; the newer one ships.)
    concurrency:
      group: release-feed
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crushlab-android
          path: .
      - name: Keep the newest build marked latest
        # Runs can finish out of order. The in-app update check and the crushlab.apk link both
        # read the latest release, so an older run must not take that mark from a newer one.
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
        # Only a crushLAB release counts: this repo's other branch once published another game's
        # build-<n> releases, and one of those must not keep the latest mark from a crushLAB build.
        run: |
          if [[ "$GITHUB_REF_NAME" != "$RELEASE_BRANCH" ]]; then
            echo "::notice::$GITHUB_REF_NAME is not the release branch ($RELEASE_BRANCH); publishing build-${{ github.run_number }} as a prerelease"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets 2>/dev/null || echo '{}')
          current=$(jq -r '.tagName // ""' <<<"$latest")
          ours=$(jq -r '[.assets[]?.name] | index("crushlab.apk") != null' <<<"$latest")
          n=${current#build-}
          if [[ "$ours" == "true" && "$n" =~ ^[0-9]+$ ]] && (( n > ${{ github.run_number }} )); then
            echo "::notice::$current is newer; publishing build-${{ github.run_number }} without marking it latest"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: crushLAB build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.order.outputs.prerelease }}
          make_latest: ${{ steps.order.outputs.latest }}
          body: |
            crushLAB build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}). Adults only (18+).

            **Android app (APK)**: download `crushlab.apk` below and open it to install crushLAB, or to
            upgrade it in place (allow installs from your browser or file manager when Android asks).
            The app checks this release feed for updates. `crushlab-${{ github.run_number }}.apk` is the
            same file with the build number in its name.
            Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/crushlab.apk

            **Web app (PWA)**: not published yet. GitHub Pages for this repository still serves an
            older project until it deploys from the crushLAB branch; the README says when that changes.
            Until then, use the APK.
          files: |
            crushlab-${{ github.run_number }}.apk
            crushlab.apk
